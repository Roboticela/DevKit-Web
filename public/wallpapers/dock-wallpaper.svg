<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-label="Desktop wallpaper — dusk gradient over mountain ridges">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2a6b"/>
      <stop offset="0.35" stop-color="#5a3d8f"/>
      <stop offset="0.62" stop-color="#c65d7b"/>
      <stop offset="0.85" stop-color="#f7a76c"/>
      <stop offset="1" stop-color="#ffd9a0"/>
    </linearGradient>
    <linearGradient id="ridgeFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3a7a"/>
      <stop offset="1" stop-color="#31265c"/>
    </linearGradient>
    <linearGradient id="ridgeMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33286b"/>
      <stop offset="1" stop-color="#221b4a"/>
    </linearGradient>
    <linearGradient id="ridgeNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1745"/>
      <stop offset="1" stop-color="#120e2e"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3d6"/>
      <stop offset="0.55" stop-color="#ffd9a0"/>
      <stop offset="1" stop-color="#ffd9a0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7a76c"/>
      <stop offset="0.4" stop-color="#8a5296"/>
      <stop offset="1" stop-color="#1d1745"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="900" fill="url(#sky)"/>

  <circle cx="720" cy="560" r="180" fill="url(#sun)"/>
  <circle cx="720" cy="560" r="70" fill="#ffe9c4"/>

  <g fill="#ffffff">
    <circle cx="200" cy="120" r="1.6"/>
    <circle cx="420" cy="80" r="1.2"/>
    <circle cx="980" cy="140" r="1.4"/>
    <circle cx="1240" cy="90" r="1.8"/>
    <circle cx="640" cy="60" r="1.1"/>
    <circle cx="80" cy="260" r="1.2"/>
    <circle cx="1360" cy="220" r="1.3"/>
  </g>

  <path fill="url(#ridgeFar)" d="M0 560 L180 430 L320 540 L520 400 L700 560 L900 460 L1120 580 L1300 480 L1440 560 L1440 900 L0 900 Z"/>
  <path fill="url(#ridgeMid)" d="M0 660 L220 560 L420 680 L640 560 L860 700 L1080 600 L1280 700 L1440 640 L1440 900 L0 900 Z"/>

  <rect y="760" width="1440" height="140" fill="url(#lake)" opacity="0.85"/>
  <path fill="url(#ridgeNear)" d="M0 800 L260 720 L520 820 L800 740 L1080 840 L1320 780 L1440 820 L1440 900 L0 900 Z"/>
</svg>
